<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Lonches - Mamá</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #d9534f;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .section {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        h3 {
            margin-top: 0;
            color: #0275d8;
            font-size: 18px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .search-bar {
            border: 2px solid #0275d8;
            background-color: #eaf4fd;
        }
        .btn {
            background-color: #5cb85c;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:active { background-color: #4cae4c; }
        
        /* Estilos para las cuentas separadas */
        .cuenta-card {
            border: 2px solid #555;
            border-radius: 8px;
            margin-top: 15px;
            background-color: #fff;
            overflow: hidden;
        }
        .cuenta-header {
            background-color: #333;
            color: white;
            padding: 10px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .cuenta-body { padding: 10px; }
        .ticket-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .total-box {
            font-size: 20px;
            font-weight: bold;
            text-align: right;
            margin-top: 10px;
            color: #d9534f;
        }
        .btn-borrar {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-cobrar {
            background-color: #f0ad4e;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>🌮 Lonchería de Mamá</h1>
    <div class="subtitle">Sistema de Cuentas por Cliente</div>

    <!-- Buscador -->
    <div class="section">
        <input type="text" id="buscador" class="search-bar" onkeyup="renderizarCuentas()" placeholder="🔍 Buscar cuenta por nombre...">
    </div>

    <!-- Formulario para Agregar Pedido -->
    <div class="section">
        <h3>📝 Nuevo Pedido</h3>
        
        <label for="cliente">Nombre del Cliente:</label>
        <input type="text" id="cliente" placeholder="Ej. Doña María, Juan, Niño de secundaria...">

        <label for="tipo">¿Qué va a ser?</label>
        <select id="tipo" onchange="actualizarOpciones()">
            <option value="Lonche">Lonche</option>
            <option value="Agua Fresca">Agua Fresca</option>
            <option value="Extra / Otro">Otro / Pedido Especial</option>
        </select>

        <label for="nombreItem">Nombre o Sabor:</label>
        <input type="text" id="nombreItem" placeholder="Ej. Pierna, Horchata, Doble queso...">

        <label for="precio">Precio ($):</label>
        <input type="number" id="precio" placeholder="0.00">

        <label for="detalles">Notas especiales (opcional):</label>
        <textarea id="detalles" rows="2" placeholder="Ej. Sin chile, tostado..."></textarea>

        <button class="btn" onclick="agregarAlPedido()">➕ Agregar a la Cuenta</button>
    </div>

    <!-- Listado de Cuentas -->
    <div class="section">
        <h3>🧾 Cuentas Activas</h3>
        <div id="contenedorCuentas">
            <p style="color: #888; text-align: center;">No hay cuentas activas en este momento.</p>
        </div>
    </div>

    <script>
        // Aquí guardaremos todas las cuentas agrupadas por el nombre del cliente
        let cuentas = {};

        function actualizarOpciones() {
            let tipo = document.getElementById("tipo").value;
            let inputNombre = document.getElementById("nombreItem");
            if (tipo === "Lonche") {
                inputNombre.placeholder = "Ej. Jamón, Milanesa, Pierna...";
            } else if (tipo === "Agua Fresca") {
                inputNombre.placeholder = "Ej. Horchata, Jamaica, Limón...";
            } else {
                inputNombre.placeholder = "Ej. Sabritones, Refresco, etc.";
            }
        }

        function agregarAlPedido() {
            let clienteInput = document.getElementById("cliente").value.trim();
            let tipo = document.getElementById("tipo").value;
            let nombreItem = document.getElementById("nombreItem").value.trim();
            let precio = parseFloat(document.getElementById("precio").value);
            let detalles = document.getElementById("detalles").value.trim();

            if (!clienteInput) {
                alert("Por favor, escribe el nombre del cliente para abrir su cuenta.");
                return;
            }
            if (!nombreItem || isNaN(precio)) {
                alert("Por favor escribe el producto y su precio.");
                return;
            }

            // Convertimos el nombre a minúsculas para que "Juan" y "juan" sean la misma cuenta
            let claveCliente = clienteInput.toLowerCase();

            // Si el cliente no existe, le creamos su cuenta
            if (!cuentas[claveCliente]) {
                cuentas[claveCliente] = {
                    nombreOriginal: clienteInput,
                    items: []
                };
            }

            // Agregamos el producto a la cuenta de ese cliente
            cuentas[claveCliente].items.push({
                id: Date.now(),
                tipo: tipo,
                nombre: nombreItem,
                precio: precio,
                detalles: detalles
            });

            // Limpiamos los campos del producto, PERO dejamos el nombre del cliente 
            // por si tu mamá quiere agregarle otro producto enseguida
            document.getElementById("nombreItem").value = "";
            document.getElementById("precio").value = "";
            document.getElementById("detalles").value = "";
            
            // Borramos el buscador por si estaba buscando a alguien y actualizamos
            document.getElementById("buscador").value = "";
            renderizarCuentas();
        }

        function eliminarItem(claveCliente, idItem) {
            // Filtramos para quitar el producto seleccionado
            cuentas[claveCliente].items = cuentas[claveCliente].items.filter(item => item.id !== idItem);
            
            // Si la cuenta se queda vacía, la eliminamos por completo
            if (cuentas[claveCliente].items.length === 0) {
                delete cuentas[claveCliente];
            }
            renderizarCuentas();
        }

        function cobrarCuenta(claveCliente) {
            let nombre = cuentas[claveCliente].nombreOriginal;
            if (confirm(`¿Cobrar y cerrar la cuenta de ${nombre}?`)) {
                delete cuentas[claveCliente]; // Borramos la cuenta
                renderizarCuentas();
            }
        }

        function renderizarCuentas() {
            let contenedor = document.getElementById("contenedorCuentas");
            let textoBuscador = document.getElementById("buscador").value.toLowerCase();
            
            let html = "";
            let hayCuentasVisibles = false;

            // Recorremos todas las cuentas guardadas
            for (let clave in cuentas) {
                // Si estamos buscando y el nombre no coincide, nos lo saltamos
                if (textoBuscador !== "" && !clave.includes(textoBuscador)) {
                    continue; 
                }

                hayCuentasVisibles = true;
                let cuenta = cuentas[clave];
                let totalCuenta = 0;
                let itemsHtml = "";

                // Generamos los productos de esta cuenta
                cuenta.items.forEach(item => {
                    totalCuenta += item.precio;
                    itemsHtml += `
                        <div class="ticket-item">
                            <div>
                                <strong>${item.tipo}: ${item.nombre}</strong><br>
                                <small style="color: #555;">${item.detalles ? 'Nota: ' + item.detalles : ''}</small>
                            </div>
                            <div style="text-align: right;">
                                $${item.precio.toFixed(2)}<br>
                                <button class="btn-borrar" onclick="eliminarItem('${clave}', ${item.id})">Quitar</button>
                            </div>
                        </div>
                    `;
                });

                // Armamos la tarjeta (el ticket) visual del cliente
                html += `
                    <div class="cuenta-card">
                        <div class="cuenta-header">
                            <span>👤 ${cuenta.nombreOriginal}</span>
                        </div>
                        <div class="cuenta-body">
                            ${itemsHtml}
                            <div class="total-box">Total a pagar: $${totalCuenta.toFixed(2)}</div>
                            <button class="btn-cobrar" onclick="cobrarCuenta('${clave}')">✅ Cobrar esta cuenta</button>
                        </div>
                    </div>
                `;
            }

            if (!hayCuentasVisibles) {
                contenedor.innerHTML = '<p style="color: #888; text-align: center;">No hay cuentas que coincidan.</p>';
            } else {
                contenedor.innerHTML = html;
            }
        }
    </script>

</body>
</html>
